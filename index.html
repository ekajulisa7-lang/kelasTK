<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Angka dan Cerita</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #87CEEB; /* Sky blue */
            background-image: radial-gradient(circle at 50% 50%, #fff 2%, transparent 5%), radial-gradient(circle at 10% 20%, #fff 3%, transparent 6%), radial-gradient(circle at 90% 80%, #fff 2.5%, transparent 5%);
            background-size: 150px 150px;
            overflow-x: hidden;
            touch-action: manipulation; /* Prevent double-tap zoom on mobile */
        }
        h1, h2, h3, .title-font {
            font-family: 'Fredoka', sans-serif;
        }
        .btn-kid {
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
        }
        .btn-kid:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }
        .btn-answer {
            transition: all 0.2s ease;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
        }
        .btn-answer:active {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.15);
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s infinite;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
        .animate-fly-away {
            animation: fly-away 2s forwards;
            opacity: 0.5;
        }
        @keyframes fly-away {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(100px, -150px) scale(0.5); opacity: 0; }
        }
        .pop-in {
            animation: pop-in 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        @keyframes pop-in {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>

        // --- Audio System ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); // G5
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'wrong') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'fanfare') {
                // Simple fanfare
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, i) => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.value = freq;
                    gain2.gain.setValueAtTime(0, audioCtx.currentTime);
                    gain2.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.15);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.15 + 0.4);
                    osc2.start(audioCtx.currentTime + i * 0.15);
                    osc2.stop(audioCtx.currentTime + i * 0.15 + 0.5);
                });
            }
        }

        function speakText(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.9; // Slightly slower for kids
            utterance.pitch = 1.2; // Cheerful pitch
            window.speechSynthesis.speak(utterance);
        }

        function stopSpeaking() {
            window.speechSynthesis.cancel();
        }

                            🏆 Hasilku
                        </button>

            `;

            document.body.addEventListener('click', initAudio, { once: true });

        function initAudio() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            speakText("Halo, Teman! Yuk, kita berpetualang bersama!");

        function goHome() {
            playSound('click');
            currentLevel = null;

            `;

            gameData.forEach(level => {
                html += `
                    <button onclick="startLevel(${level.id})" class="${level.color} ${level.border} border-b-8 text-white p-6 rounded-3xl btn-kid flex flex-col items-center justify-center gap-3">

                        <span class="title-font text-xl font-bold">${level.title}</span>
                    </button>
                `;
            });

            html += `</div></div>`;
            contentArea.innerHTML = html;
            speakText("Pilih Level Petualanganmu!");
        }

            // Shortcut to Level 5 (Story)
            startLevel(5);
        }

            playSound('click');
            currentLevel = gameData.find(l => l.id === id);

            storyIndex = 0;
            showingFollowUp = false;

            if (currentLevel.story) {
                renderStorySegment();
            } else {
                renderQuestion();
            }
        }

            stopSpeaking();
            const segment = currentLevel.story[storyIndex];
            
            contentArea.innerHTML = `
                <div class="text-center w-full max-w-2xl pop-in flex flex-col items-center justify-center h-full">
                    <h2 class="title-font text-4xl text-pink-600 mb-8 font-bold">${currentLevel.title}</h2>
                    
                    <div class="bg-yellow-50 rounded-[3rem] border-4 border-yellow-200 p-8 w-full shadow-lg mb-8 relative">
                        <button onclick="speakText('${segment.text}')" class="absolute -top-6 -right-6 bg-blue-400 text-white rounded-full p-4 text-3xl btn-kid border-b-4 border-blue-600">🔊</button>
                        
                        <div class="text-7xl mb-8">${segment.img}</div>
                        <p class="text-3xl font-bold text-gray-700 leading-snug">${segment.text}</p>
                    </div>

                    <button onclick="nextStorySegment()" class="bg-green-500 hover:bg-green-600 text-white title-font text-3xl py-4 px-12 rounded-full btn-kid border-b-8 border-green-700">
                        ${storyIndex < currentLevel.story.length - 1 ? 'Lanjut ➡️' : 'Mulai Menjawab ❓'}
                    </button>
                </div>
            `;
            speakText(segment.text);
        }

        function nextStorySegment() {
            playSound('click');
            if (storyIndex < currentLevel.story.length - 1) {
                storyIndex++;
                renderStorySegment();
            } else {
                renderQuestion();
            }
        }

        function renderQuestion() {
            stopSpeaking();
            const qData = currentLevel.questions[currentQuestionIndex];
            const actualQuestion = showingFollowUp ? qData.followUp : qData;
            
            let visualHTML = "";

            // Render Visuals based on Question Type
            if (qData.type !== 'logic' && !qData.isText) {
                if (qData.count) {
                    // Simple Counting
                    visualHTML = `<div class="flex flex-wrap justify-center gap-2 mb-6 max-w-lg mx-auto text-5xl">
                        ${Array(qData.count).fill(`<span>${qData.items}</span>`).join('')}
                    </div>`;
                } else if (qData.formula) {
                    // Addition
                    visualHTML = `
                        <div class="flex flex-wrap justify-center items-center gap-4 mb-6 max-w-xl mx-auto text-5xl bg-blue-50 p-6 rounded-3xl border-4 border-blue-200">
                            <div class="flex flex-wrap justify-center gap-1 w-2/5">
                                ${Array(qData.formula[0]).fill(`<span>${qData.items}</span>`).join('')}
                            </div>
                            <div class="text-4xl font-bold text-blue-500">➕</div>
                            <div class="flex flex-wrap justify-center gap-1 w-2/5">
                                ${Array(qData.formula[1]).fill(`<span>${qData.items}</span>`).join('')}
                            </div>
                        </div>`;
                } else if (qData.start && qData.sub) {
                    // Subtraction with Animation
                    let remain = qData.start - qData.sub;
                    visualHTML = `
                        <div class="flex flex-wrap justify-center items-center gap-2 mb-6 max-w-xl mx-auto text-5xl bg-green-50 p-6 rounded-3xl border-4 border-green-200">
                            ${Array(remain).fill(`<span>${qData.items}</span>`).join('')}
                            ${Array(qData.sub).fill(`<span class="animate-fly-away">${qData.items}</span>`).join('')}
                        </div>`;
                }
            } else if (qData.type === 'logic') {
                 visualHTML = `<div class="text-7xl mb-6 animate-bounce-slow">🤔</div>`;
            }

            let optionsHTML = "";
            const isTextOptions = typeof actualQuestion.options[0] === 'string';
            
            actualQuestion.options.forEach((opt, idx) => {
                optionsHTML += `
                    <button onclick="checkAnswer('${opt}', '${actualQuestion.answer}')" 
                            class="bg-white border-4 border-${currentLevel.color.split('-')[1]}-300 hover:bg-gray-50 text-gray-800 title-font ${isTextOptions ? 'text-2xl p-4' : 'text-4xl py-6 px-4'} rounded-3xl btn-answer w-full">
                        ${opt}
                    </button>
                `;
            });

            contentArea.innerHTML = `
                <div class="w-full max-w-3xl pop-in flex flex-col items-center justify-center h-full">
                    <div class="w-full flex justify-between items-center mb-4">
                        <span class="text-xl font-bold text-gray-500 bg-gray-100 px-4 py-2 rounded-full">
                            Soal ${currentQuestionIndex + 1} / ${currentLevel.questions.length}
                        </span>
                        <button onclick="speakText('${actualQuestion.q.replace(/'/g, "\\'")}')" class="bg-blue-400 text-white rounded-full p-3 text-2xl btn-kid border-b-4 border-blue-600">🔊 Dengarkan</button>
                    </div>

                    <h3 class="text-2xl md:text-3xl font-bold text-center mb-6 leading-relaxed text-gray-700">
                        ${actualQuestion.q}
                    </h3>
                    
                    ${visualHTML}

                    <div class="grid ${isTextOptions ? 'grid-cols-1' : 'grid-cols-3'} gap-4 w-full mt-auto">
                        ${optionsHTML}
                    </div>
                </div>
            `;
            
            speakText(actualQuestion.q);
        }

        function checkAnswer(selected, correct) {
            stopSpeaking();
            const isCorrect = String(selected) === String(correct);
            showFeedback(isCorrect);
        }

        function showFeedback(isCorrect) {
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            const icon = document.getElementById('feedback-icon');
            const title = document.getElementById('feedback-title');
            const message = document.getElementById('feedback-message');
            const btn = document.getElementById('feedback-btn');

            modal.classList.remove('hidden');
            
            // Allow layout to render before removing scale to trigger transition
            setTimeout(() => {
                card.classList.remove('scale-50');
                card.classList.add('scale-100');
            }, 10);

            // Remove previous event listeners
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);

            if (isCorrect) {
                playSound('correct');
                score += 10;
                totalStars += 1;
                scoreDisplay.innerText = score;
                
                icon.innerText = "🌟";
                title.innerText = "Hebat!";
                title.className = "title-font text-4xl font-bold mb-2 text-green-500";
                message.innerText = "+10 Poin! Kamu pintar sekali!";
                newBtn.className = "w-full bg-green-500 hover:bg-green-600 text-white title-font text-2xl py-4 rounded-full btn-kid border-b-4 border-green-700";
                newBtn.innerText = "Lanjut 🚀";
                
                speakText("Hebat! Jawabanmu benar.");

                newBtn.onclick = () => {
                    playSound('click');
                    closeFeedback();
                    handleNextState();
                };
            } else {
                playSound('wrong');
                icon.innerText = "💪";
                title.innerText = "Hampir Benar!";
                title.className = "title-font text-4xl font-bold mb-2 text-orange-500";
                message.innerText = "Tidak apa-apa! Yuk coba lagi, kamu pasti bisa! 😊";
                newBtn.className = "w-full bg-orange-400 hover:bg-orange-500 text-white title-font text-2xl py-4 rounded-full btn-kid border-b-4 border-orange-600";
                newBtn.innerText = "Coba Lagi ↺";
                
                speakText("Tidak apa-apa! Yuk coba lagi, kamu pasti bisa!");

                newBtn.onclick = () => {
                    playSound('click');
                    closeFeedback();
                    // Just close modal, let them try again
                };
            }
        }

        function closeFeedback() {
            const modal = document.getElementById('feedback-modal');
            const card = document.getElementById('feedback-card');
            card.classList.remove('scale-100');
            card.classList.add('scale-50');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        function handleNextState() {
            const qData = currentLevel.questions[currentQuestionIndex];
            
            // Check if there is a follow up question (Level 6 logic)
            if (qData.followUp && !showingFollowUp) {
                showingFollowUp = true;
                renderQuestion();
                return;
            }

            // Move to next question
            showingFollowUp = false;
            currentQuestionIndex++;
            
            if (currentQuestionIndex < currentLevel.questions.length) {
                renderQuestion();
            } else {
                completedLevels++;
                renderLevelComplete();
            }
        }

        function renderLevelComplete() {
            stopSpeaking();
            playSound('fanfare');
            
            contentArea.innerHTML = `
                <div class="text-center pop-in w-full max-w-md">
                    <div class="text-8xl mb-6 animate-bounce-slow">🏆</div>
                    <h2 class="title-font text-4xl font-bold text-yellow-500 mb-4">Misi Selesai!</h2>
                    <p class="text-2xl text-gray-700 font-bold mb-8">Kamu berhasil menyelesaikan ${currentLevel.title}!</p>
                    <button onclick="playSound('click'); renderLevelMenu()" class="bg-blue-500 hover:bg-blue-600 text-white title-font text-3xl py-4 px-12 rounded-full btn-kid w-full border-b-8 border-blue-700">
                        Peta Level 🗺️
                    </button>
                </div>
            `;
            speakText("Misi Selesai! Kamu luar biasa!");
        }

        function renderFinalResult() {
            stopSpeaking();
            playSound('fanfare');
            header.classList.add('hidden');
            
            let rank = "";
            let rankIcon = "";
            if (score <= 300) { // Assuming total score can be up to ~500 based on questions array lengths
                rank = "Penjelajah Angka";
                rankIcon = "🔭";
            } else if (score <= 500) {
                rank = "Detektif Hebat";
                rankIcon = "🕵️";
            } else {
                rank = "Pahlawan Matematika";
                rankIcon = "🦸‍♂️";
            }

            contentArea.innerHTML = `
                <div class="text-center pop-in w-full max-w-2xl bg-white/90 p-8 rounded-[3rem] shadow-xl z-10 border-8 border-yellow-300">
                    <h2 class="title-font text-4xl md:text-5xl font-bold text-red-500 mb-2">🎊 HEBAT! 🎊</h2>
                    <h3 class="title-font text-3xl text-blue-500 mb-8">Petualanganmu Selesai!</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-8">
                        <div class="bg-yellow-100 p-4 rounded-3xl border-4 border-yellow-300">
                            <div class="text-4xl mb-2">⭐</div>
                            <div class="text-xl font-bold text-gray-600">Total Bintang</div>
                            <div class="title-font text-3xl text-yellow-600">${totalStars}</div>
                        </div>
                        <div class="bg-green-100 p-4 rounded-3xl border-4 border-green-300">
                            <div class="text-4xl mb-2">💯</div>
                            <div class="text-xl font-bold text-gray-600">Total Poin</div>
                            <div class="title-font text-3xl text-green-600">${score}</div>
                        </div>
                    </div>

                    <div class="bg-purple-100 p-6 rounded-3xl border-4 border-purple-300 mb-8">
                        <div class="text-xl text-gray-600 font-bold mb-2">Gelar Petualangmu:</div>
                        <div class="title-font text-4xl text-purple-600 flex justify-center items-center gap-3">
                            ${rankIcon} ${rank}
                        </div>
                    </div>

                    <p class="text-2xl text-gray-700 font-bold mb-8">Hebat! Kamu sudah belajar menghitung, memahami cerita, dan mencari solusi. Terus berlatih ya! 🌟</p>
                    
                    <button onclick="playSound('click'); location.reload()" class="bg-orange-500 hover:bg-orange-600 text-white title-font text-3xl py-4 px-12 rounded-full btn-kid border-b-8 border-orange-700">
                        Main Lagi 🔄
                    </button>
                </div>
            `;
            
            speakText(`Hebat! Petualanganmu Selesai! Kamu mendapat gelar ${rank}. Terus berlatih ya!`);
            startConfetti();
        }

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const pieces = [];
            const colors = ['#f44336', '#e91e63', '#9c27b0', '#673ab7', '#3f51b5', '#2196f3', '#03a9f4', '#00bcd4', '#009688', '#4CAF50', '#8BC34A', '#CDDC39', '#FFEB3B', '#FFC107', '#FF9800', '#FF5722'];

            for (let i = 0; i < 150; i++) {
                pieces.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    w: Math.random() * 10 + 5,
                    h: Math.random() * 10 + 5,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speed: Math.random() * 3 + 2,
                    angle: Math.random() * 360,
                    spin: Math.random() * 5 - 2.5
                });
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                pieces.forEach(p => {
                    ctx.save();
                    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                    ctx.rotate(p.angle * Math.PI / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                    ctx.restore();

                    p.y += p.speed;
                    p.angle += p.spin;

                    if (p.y > canvas.height) {
                        p.y = -10;
                        p.x = Math.random() * canvas.width;
                    }
                });
                requestAnimationFrame(animate);
            }
            animate();
            
            // Resize canvas on window resize
            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        }

        // --- Init ---
        window.onload = () => {
            renderHome();
        };
    </script>
</body>
</html>
